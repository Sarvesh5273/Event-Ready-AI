openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: EventReady AI wedding-guest outfit decision sessions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new EventReady session
      description: >-
        Creates a new stateless session for the Wedding Guest flow. Returns a
        signed session token that must be sent back on every subsequent call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sessions/{sessionId}/analyze:
    post:
      operationId: startSessionAnalysis
      tags: [sessions]
      summary: Start Skin Analysis + Apparel VTO processing for a session
      description: >-
        Starts the (replayed, in Demo Mode) processing pipeline. Returns
        immediately with an updated signed token; the client polls
        getSessionStatus for progress. Never blocks on the full pipeline.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeInput"
      responses:
        "200":
          description: Analysis started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid or mismatched session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sessions/{sessionId}/status:
    get:
      operationId: getSessionStatus
      tags: [sessions]
      summary: Poll processing status for a session
      description: >-
        Verifies the signed session token and returns the current processing
        step. The client polls this endpoint every few seconds while
        status is "processing".
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid or mismatched session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sessions/{sessionId}/report:
    get:
      operationId: getSessionReport
      tags: [sessions]
      summary: Get the final EventReady recommendation report
      description: >-
        Returns the full recommendation report once the session status is
        "ready". Computes outfit selection and confidence scoring using the
        explainable v0 rule engine.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: EventReady recommendation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReadyReport"
        "400":
          description: Invalid session token or session not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sessions/{sessionId}/video:
    post:
      operationId: startSessionVideo
      tags: [sessions]
      summary: Start generating the bonus outfit video
      description: >-
        Starts a YouCam Image-to-Video task for the try-on image of the
        outfit this session recommends. Deliberately user-triggered rather
        than automatic — it is the most expensive call in the product, so it
        only ever runs when the user asks for it. Returns immediately with an
        updated signed token; the client polls getSessionVideo for progress.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Video generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionVideo"
        "400":
          description: Invalid or mismatched session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: getSessionVideo
      tags: [sessions]
      summary: Poll the bonus outfit video task
      description: >-
        Advances an already-started Image-to-Video task by exactly one status
        check and returns its state plus an updated signed token. Never
        starts a task itself, so polling can never incur cost — in Live Mode
        status is "idle" until startSessionVideo has been called. Demo Mode
        replays a clip generated offline, so it reports "success" immediately;
        there is no paid task to protect.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current video task state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionVideo"
        "400":
          description: Invalid or mismatched session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    StyleVibe:
      type: string
      enum: [classic, bold]
    StyleVibeOrEither:
      type: string
      enum: [classic, bold, either]
    SessionMode:
      type: string
      description: >-
        "demo" replays fixed, previously-captured YouCam API results for the
        Maya demo persona. "live" runs real YouCam Skin Analysis + Apparel
        VTO API calls against the user's own uploaded photos; it is only
        offered when YOUCAM_API_KEY is configured.
      enum: [demo, live]
    SessionStatus:
      type: string
      enum: [created, processing, ready, error]
    GarmentCategory:
      type: string
      enum: [full_body, upper_body, lower_body]
    GarmentSource:
      type: string
      description: >-
        "catalog" recommends from the curated wedding-guest catalog
        (default). "custom" lets the user try on and get a skin/color
        compatibility read for a garment they already have in mind, uploaded
        as their own photo. Live Mode only — Demo Mode sessions always
        behave as "catalog", since there's no pre-captured demo asset for an
        arbitrary upload.
      enum: [catalog, custom]
    ColorFamily:
      type: string
      enum:
        [
          navy,
          emerald,
          sage,
          black,
          rose,
          champagne,
          lavender,
          teal,
          burgundy,
          coral,
          mustard,
          ivory,
          terracotta,
        ]
    Undertone:
      type: string
      enum: [cool, warm, neutral]
    FabricFinish:
      type: string
      enum: [matte, soft_sheen, high_shine]
    Silhouette:
      type: string
      description: >-
        Garment shapes across all supported traditions. Must stay in sync with
        the catalog — the report response is validated against this enum, so a
        silhouette missing here fails the whole report rather than one item.
      enum:
        [
          midi_dress,
          slip_dress,
          jumpsuit,
          blazer_set,
          maxi_dress,
          wrap_dress,
          saree,
          lehenga,
          anarkali,
          sharara,
          qipao,
          hanbok,
          ao_dai,
          abaya,
          kaftan,
        ]
    SkinSignalLevel:
      type: string
      enum: [low, medium, high, unknown]
    ReasonCode:
      type: string
      enum:
        - wedding_guest_match
        - style_vibe_match
        - cool_tone_supports_redness
        - matte_finish_supports_oiliness
        - contrast_supports_tired_eye_area
        - soft_color_supports_low_radiance
        - bold_color_matches_vibe
        - classic_silhouette_matches_vibe
        - high_shine_camera_caution
        - matte_finish_supports_texture
        - high_shine_texture_caution
        - warm_tone_redness_caution
        - style_vibe_mismatch
        - palette_hero_color
        - palette_harmonious_color
        - palette_neutral_color
        - palette_clash_color
        - color_reading_unavailable
    VtoTaskStatus:
      type: string
      enum: [queued, running, success, error]
    VideoTaskStatus:
      type: string
      enum: [success, error, skipped]
    EventReadyVideo:
      type: object
      description: >-
        Optional bonus short animated clip generated from the recommended
        outfit's successful try-on image (YouCam AI Image to Video
        Generator). Live Mode only.
      properties:
        status:
          $ref: "#/components/schemas/VideoTaskStatus"
        videoUrl:
          type: ["string", "null"]
      required:
        - status
        - videoUrl
    SessionVideo:
      type: object
      description: >-
        State of the on-demand bonus outfit video, plus the updated signed
        session token that carries that state. "idle" means the user has not
        asked for a video yet; "skipped" means there was no successful try-on
        image to animate.
      properties:
        sessionToken:
          type: string
        status:
          type: string
          enum: [idle, queued, running, success, error, skipped]
        videoUrl:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
      required:
        - sessionToken
        - status
        - videoUrl
        - errorMessage
    GarmentTradition:
      type: string
      description: The dressing tradition a catalog garment belongs to.
      enum: [western, indian, east_asian, middle_eastern]
    TraditionPreference:
      type: string
      description: >-
        Which dressing tradition to shortlist from. "any" spans the whole
        catalog; any other value is a hard filter on the catalog rather than a
        scoring preference.
      enum: [any, western, indian, east_asian, middle_eastern]
    UserPreferences:
      type: object
      properties:
        occasion:
          type: string
          enum: [wedding_guest]
        styleVibe:
          $ref: "#/components/schemas/StyleVibe"
        tradition:
          $ref: "#/components/schemas/TraditionPreference"
      required:
        - occasion
        - styleVibe
        - tradition
    SessionInput:
      type: object
      properties:
        mode:
          $ref: "#/components/schemas/SessionMode"
        preferences:
          $ref: "#/components/schemas/UserPreferences"
        garmentSource:
          $ref: "#/components/schemas/GarmentSource"
      required:
        - mode
        - preferences
    AnalyzeInput:
      type: object
      properties:
        sessionToken:
          type: string
        selfieImage:
          $ref: "#/components/schemas/UploadedImage"
        fullBodyImage:
          $ref: "#/components/schemas/UploadedImage"
        garmentImage:
          $ref: "#/components/schemas/UploadedImage"
        garmentCategory:
          $ref: "#/components/schemas/GarmentCategory"
      required:
        - sessionToken
    UploadedImage:
      type: object
      description: >-
        Raw image bytes for Live Mode uploads, base64-encoded and sent inline
        in the JSON request body. Required on `startSessionAnalysis` only
        when the session's mode is "live"; Demo Mode sessions never send
        these (the demo persona's photos are fixed, pre-captured assets).
      properties:
        base64Data:
          type: string
          description: Raw image bytes, base64-encoded (no data URL prefix).
        contentType:
          type: string
          description: MIME type of the image, e.g. "image/jpeg".
      required:
        - base64Data
        - contentType
    Session:
      type: object
      properties:
        sessionId:
          type: string
        sessionToken:
          type: string
          description: Opaque, HMAC-signed token. Must be echoed back on every call.
        mode:
          $ref: "#/components/schemas/SessionMode"
        preferences:
          $ref: "#/components/schemas/UserPreferences"
        garmentSource:
          $ref: "#/components/schemas/GarmentSource"
        status:
          $ref: "#/components/schemas/SessionStatus"
        currentStep:
          type: number
          description: Index (0-4) into `steps` of the currently active/last-completed step.
        steps:
          type: array
          items:
            type: string
        errorMessage:
          type: ["string", "null"]
      required:
        - sessionId
        - sessionToken
        - mode
        - preferences
        - garmentSource
        - status
        - currentStep
        - steps
        - errorMessage
    CatalogItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        garmentCategory:
          $ref: "#/components/schemas/GarmentCategory"
        tradition:
          $ref: "#/components/schemas/GarmentTradition"
        imageUrl:
          type: string
        styleVibe:
          $ref: "#/components/schemas/StyleVibeOrEither"
        colorFamily:
          $ref: "#/components/schemas/ColorFamily"
        undertone:
          $ref: "#/components/schemas/Undertone"
        fabricFinish:
          $ref: "#/components/schemas/FabricFinish"
        silhouette:
          $ref: "#/components/schemas/Silhouette"
        occasionTags:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - garmentCategory
        - tradition
        - imageUrl
        - styleVibe
        - colorFamily
        - undertone
        - fabricFinish
        - silhouette
        - occasionTags
    NormalizedSkinSignals:
      type: object
      properties:
        redness:
          $ref: "#/components/schemas/SkinSignalLevel"
        oiliness:
          $ref: "#/components/schemas/SkinSignalLevel"
        darkCircles:
          $ref: "#/components/schemas/SkinSignalLevel"
        radiance:
          $ref: "#/components/schemas/SkinSignalLevel"
        moisture:
          $ref: "#/components/schemas/SkinSignalLevel"
        texture:
          $ref: "#/components/schemas/SkinSignalLevel"
      required:
        - redness
        - oiliness
        - darkCircles
        - radiance
        - moisture
        - texture
    OutfitCandidate:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/CatalogItem"
        selectionReasons:
          type: array
          items:
            $ref: "#/components/schemas/ReasonCode"
      required:
        - item
        - selectionReasons
    VtoResult:
      type: object
      properties:
        catalogItemId:
          type: string
        status:
          $ref: "#/components/schemas/VtoTaskStatus"
        resultImageUrl:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
      required:
        - catalogItemId
        - status
        - resultImageUrl
        - errorMessage
    OutfitScore:
      type: object
      properties:
        catalogItemId:
          type: string
        confidenceScore:
          type: number
        reasonCodes:
          type: array
          items:
            $ref: "#/components/schemas/ReasonCode"
        cautionCodes:
          type: array
          items:
            $ref: "#/components/schemas/ReasonCode"
        userFacingReasons:
          type: array
          items:
            type: string
        userFacingCautions:
          type: array
          items:
            type: string
      required:
        - catalogItemId
        - confidenceScore
        - reasonCodes
        - cautionCodes
        - userFacingReasons
        - userFacingCautions
    CustomGarmentScore:
      type: object
      description: >-
        Skin/color compatibility read for a garment the user uploaded
        themselves — a narrower signal than OutfitScore, since there's no
        occasion or style preference to check a self-picked garment
        against and fabric finish can't be reliably read from a photo.
      properties:
        confidenceScore:
          type: number
        reasonCodes:
          type: array
          items:
            $ref: "#/components/schemas/ReasonCode"
        cautionCodes:
          type: array
          items:
            $ref: "#/components/schemas/ReasonCode"
        userFacingReasons:
          type: array
          items:
            type: string
        userFacingCautions:
          type: array
          items:
            type: string
      required:
        - confidenceScore
        - reasonCodes
        - cautionCodes
        - userFacingReasons
        - userFacingCautions
    CustomGarmentResult:
      type: object
      description: Present on the report only when `flow` is "custom".
      properties:
        garmentCategory:
          $ref: "#/components/schemas/GarmentCategory"
        colorFamily:
          $ref: "#/components/schemas/ColorFamily"
        undertone:
          $ref: "#/components/schemas/Undertone"
        imageUrl:
          type: string
          description: >-
            Same-origin API URL (including a signed access token as a query
            param) that serves the user's own uploaded garment photo, for
            display.
        vtoStatus:
          $ref: "#/components/schemas/VtoTaskStatus"
        vtoResultImageUrl:
          type: ["string", "null"]
        vtoErrorMessage:
          type: ["string", "null"]
        score:
          oneOf:
            - $ref: "#/components/schemas/CustomGarmentScore"
            - type: "null"
      required:
        - garmentCategory
        - colorFamily
        - undertone
        - imageUrl
        - vtoStatus
        - vtoResultImageUrl
        - vtoErrorMessage
        - score
    ColorSeason:
      type: string
      enum:
        - light_spring
        - true_spring
        - bright_spring
        - light_summer
        - true_summer
        - soft_summer
        - soft_autumn
        - true_autumn
        - deep_autumn
        - deep_winter
        - true_winter
        - bright_winter
    DominantTrait:
      type: string
      enum: [warm, cool, light, deep, bright, soft]
    PaletteColor:
      type: object
      properties:
        hex:
          type: string
        name:
          type: string
      required: [hex, name]
    FacialColorTones:
      type: object
      description: >-
        Colours measured directly from the user's selfie by the YouCam Facial
        Colour Tones task. A null field means that feature was not returned
        for this face — it is not a default.
      properties:
        skinColor:
          oneOf: [{ type: string }, { type: "null" }]
        hairColor:
          oneOf: [{ type: string }, { type: "null" }]
        hairColorName:
          oneOf: [{ type: string }, { type: "null" }]
        eyeColor:
          oneOf: [{ type: string }, { type: "null" }]
        eyeColorName:
          oneOf: [{ type: string }, { type: "null" }]
        lipColor:
          oneOf: [{ type: string }, { type: "null" }]
        eyebrowColor:
          oneOf: [{ type: string }, { type: "null" }]
      required:
        - skinColor
        - hairColor
        - hairColorName
        - eyeColor
        - eyeColorName
        - lipColor
        - eyebrowColor
    PaletteAxes:
      type: object
      description: Where the wearer sits on each axis, each running -1..+1.
      properties:
        temperature:
          type: number
        value:
          type: number
        chroma:
          type: number
      required: [temperature, value, chroma]
    ColorProofPair:
      type: object
      description: The two colours used for the side-by-side try-on proof.
      properties:
        best:
          $ref: "#/components/schemas/PaletteColor"
        worst:
          $ref: "#/components/schemas/PaletteColor"
      required: [best, worst]
    ColorReport:
      type: object
      properties:
        season:
          $ref: "#/components/schemas/ColorSeason"
        seasonLabel:
          type: string
        tagline:
          type: string
        rationale:
          type: string
        dominantTrait:
          $ref: "#/components/schemas/DominantTrait"
        axes:
          $ref: "#/components/schemas/PaletteAxes"
        axesSummary:
          type: string
        confidence:
          type: number
          description: 0..1 — how clearly the dominant trait beat the runner-up.
        measured:
          $ref: "#/components/schemas/FacialColorTones"
        heroColors:
          type: array
          items:
            $ref: "#/components/schemas/PaletteColor"
        avoidColors:
          type: array
          items:
            $ref: "#/components/schemas/PaletteColor"
        bestNeutral:
          $ref: "#/components/schemas/PaletteColor"
        proofPair:
          oneOf:
            - $ref: "#/components/schemas/ColorProofPair"
            - type: "null"
      required:
        - season
        - seasonLabel
        - tagline
        - rationale
        - dominantTrait
        - axes
        - axesSummary
        - confidence
        - measured
        - heroColors
        - avoidColors
        - bestNeutral
        - proofPair
    EventReadyReport:
      type: object
      properties:
        sessionId:
          type: string
        mode:
          $ref: "#/components/schemas/SessionMode"
        flow:
          $ref: "#/components/schemas/GarmentSource"
        recommendedCatalogItemId:
          type: string
          description: Empty string when `flow` is "custom" — nothing catalog-based to recommend.
        skinSignals:
          $ref: "#/components/schemas/NormalizedSkinSignals"
        selectedOutfits:
          type: array
          items:
            $ref: "#/components/schemas/OutfitCandidate"
        vtoResults:
          type: array
          items:
            $ref: "#/components/schemas/VtoResult"
        scores:
          type: array
          items:
            $ref: "#/components/schemas/OutfitScore"
        prepTips:
          type: array
          items:
            type: string
        video:
          oneOf:
            - $ref: "#/components/schemas/EventReadyVideo"
            - type: "null"
        customGarment:
          description: Non-null only when `flow` is "custom".
          oneOf:
            - $ref: "#/components/schemas/CustomGarmentResult"
            - type: "null"
        colorAnalysis:
          description: >-
            The personal colour reading for this session, or null when the
            colour-tones task returned nothing usable. Null means no palette
            was measured — clients must say so rather than showing a default.
          oneOf:
            - $ref: "#/components/schemas/ColorReport"
            - type: "null"
      required:
        - sessionId
        - colorAnalysis
        - mode
        - flow
        - recommendedCatalogItemId
        - skinSignals
        - selectedOutfits
        - vtoResults
        - scores
        - prepTips
        - video
        - customGarment
